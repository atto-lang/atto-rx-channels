name: Oreslang library tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pull-request-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate Python entrypoints and immutable compiler lock
        run: |
          python3 -m py_compile scripts/setup.py scripts/test.py
          python3 -c 'import re,pathlib; s=pathlib.Path("compiler.lock").read_text().strip(); assert re.fullmatch(r"[0-9a-f]{40}",s), "compiler.lock must be an exact commit SHA"'
  test-with-private-compiler:
    # NEVER expose a cross-repository access token to untrusted PR source.
    # Run integration tests on trusted protected main only.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Authenticate private compiler checkout on trusted main
        env:
          GH_TOKEN: ${{ secrets.ORES_COMPILER_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Missing read-only ORES_COMPILER_READ_TOKEN on protected main'
            exit 1
          fi
          gh auth setup-git
      - name: Build pinned compiler
        env:
          GH_TOKEN: ${{ secrets.ORES_COMPILER_READ_TOKEN }}
        run: python3 scripts/setup.py
      - name: Execute exact-compiler Rx tests
        run: source .work/env.sh && python3 scripts/test.py
