name: Oreslang library tests
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate private compiler checkout
        env:
          GH_TOKEN: ${{ secrets.ORES_COMPILER_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Set ORES_COMPILER_READ_TOKEN to a read-only token for oreslang-source.java.'
            exit 1
          fi
          gh auth setup-git
      - name: Build pinned compiler
        env:
          GH_TOKEN: ${{ secrets.ORES_COMPILER_READ_TOKEN }}
        run: python3 scripts/setup.py
      - run: source .work/env.sh && python3 scripts/test.py
