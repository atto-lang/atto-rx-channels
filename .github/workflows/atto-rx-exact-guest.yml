name: Atto RX exact-head guest validation
on:
  push:
    branches: [ci/atto-rx-queue-compiler-repair-20261125]
permissions:
  contents: read
jobs:
  guest:
    name: PR ${{ matrix.pr }} exact guest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 16
            head: 'e57fa7fc76cad7c1e973b1f78cb63a41d869fed3'
            tree: '1802f059ba6b6477839780c876f93e018d970f1f'
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Fetch and verify public application and compiler
        env:
          EXPECTED_HEAD: ${{ matrix.head }}
          EXPECTED_TREE: ${{ matrix.tree }}
        shell: bash
        run: |
          set -euo pipefail
          git init app
          git -C app fetch --depth 1 https://github.com/atto-lang/atto-rx-channels.git "$EXPECTED_HEAD"
          git -C app checkout --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C app rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          cd app
          revision="$(cat compiler.lock)"
          case "$revision" in
            3d5fe12329b8fc45249a87b836e9431e3ab89893) tree=bdfe12da277ba4560fdfff66cc14b40384c57516 ;;
            3524a7cc8cb1a2a9214e6fdfe0927a735e7f5a05) tree=cc57423ec414a93135208c26c9fbb3e60d9a3c86 ;;
            *) echo 'Unexpected compiler revision'; exit 1 ;;
          esac
          test "$revision" = 3524a7cc8cb1a2a9214e6fdfe0927a735e7f5a05
          revision=aa130a6d4ca4dbd4b1fe8f7c432d2ac9672c712a
          tree=85aa064fb7428e4b3214acfa0aae043d5f0205e4
          echo "TEST-ONLY COMPILER REPAIR; NOT ORIGINAL PIN EVIDENCE"
          test ! -e .work
          mkdir -p .work/oreslang-source.java
          git -C .work/oreslang-source.java init
          git -C .work/oreslang-source.java fetch --depth 1 https://github.com/atto-lang/atto-source.java.git "$revision"
          git -C .work/oreslang-source.java checkout --detach FETCH_HEAD
          test "$(git -C .work/oreslang-source.java rev-parse HEAD)" = "$revision"
          test "$(git -C .work/oreslang-source.java rev-parse 'HEAD^{tree}')" = "$tree"
          echo "APP_HEAD=$EXPECTED_HEAD APP_TREE=$EXPECTED_TREE COMPILER_HEAD=$revision COMPILER_TREE=$tree"
      - name: Host contract tests
        working-directory: app
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build compiler and execute guest fixtures
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/.work/oreslang-source.java"
          mvn -q -f "$compiler/pom.xml" -Dtest=BoundedQueueSourceSurfaceTest test
          mvn -q -f "$compiler/pom.xml" -DskipTests clean package
          mvn -q -f "$compiler/pom.xml" dependency:build-classpath "-Dmdep.outputFile=$PWD/.work/classpath.txt"
          export ORES_CLASSPATH="$compiler/target/classes:$(cat .work/classpath.txt)"
          python3 scripts/test.py
