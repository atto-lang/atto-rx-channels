name: Compiler setup and runner contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  setup-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify original checkout HEAD and clean source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/verify_ci_source_head_20261106.sh
      - name: Check compiler admission and failed-build launcher contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
