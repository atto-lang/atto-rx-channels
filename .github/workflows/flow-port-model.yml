name: Pull/push reference model (source-free)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  model-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute model tests (NOT AttoLang guest execution)
        run: node --test test/flow-port-model.test.mjs
